name: Publish Vegas SOR
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 12 * 8-12 *'  # Daily in season, 4:20 PST / 5:20 PDT
permissions:
  contents: write
  pages: write
concurrency:
  group: vegas-sor-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python scripts/collect.py
      - name: Restore archived rankings
        run: |
          git fetch origin gh-pages
          git worktree add -B gh-pages ../publish origin/gh-pages
          if [ -d ../publish/archive ]; then cp -a ../publish/archive docs/; fi
      - run: python scripts/build.py
      - name: Update publishing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          def snapshots(path):
              raw = Path(path).read_text().strip()
              return {s['week']: s for s in json.loads(raw.removeprefix('const season = ').removesuffix(';'))}
          incoming = snapshots('docs/season.js')
          for week, previous in snapshots('../publish/season.js').items():
              current = incoming.get(week)
              if not current or current['games'] < previous['games'] or current['through'] < previous['through']:
                  raise SystemExit(f'Week {week} would lose published results')
          PYTHON
          rsync -a --delete --exclude='.git' docs/ ../publish/
          git -C ../publish add -A
          if ! git -C ../publish diff --cached --quiet; then
            git -C ../publish -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Update weekly market rankings"
            git -C ../publish push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
