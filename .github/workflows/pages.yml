name: Publish Vegas SOR
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 10 * 9-12 3'
permissions:
  contents: write
  pages: write
concurrency:
  group: vegas-sor-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - if: github.event_name != 'push'
        run: python scripts/collect.py
      - run: python scripts/build.py
      - name: Update publishing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages
          git worktree add -B gh-pages ../publish origin/gh-pages
          rsync -a --delete --exclude='.git' docs/ ../publish/
          git -C ../publish add -A
          if ! git -C ../publish diff --cached --quiet; then
            git -C ../publish -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Update weekly market rankings"
            git -C ../publish push origin HEAD:gh-pages
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
